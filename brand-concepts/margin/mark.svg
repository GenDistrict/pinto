<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img"><title>MARGIN mark</title><desc>여백을 만드는 괄호와 짧은 메모, 마지막 점을 결합했습니다. 이미지를 크게 보고 필요한 지시만 덧붙이는 경험을 상징합니다.</desc><g transform="translate(4 2)"><path d="M25 8H9V56H25M35 18H56M35 32H50" fill="none" stroke="#203C34" stroke-width="5"/><circle cx="40" cy="50" r="6" fill="#203C34"/></g></svg>